app:
  name: happy-billing
  version: 1.0.0
  environment: dev  # dev/test/prod

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 60
  write_timeout: 60

database:
  host: localhost
  port: 5432
  username: postgres
  password: postgres
  database: happy_billing
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 60  # 分钟
  ssl_mode: disable

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 100
  min_idle_conns: 10

kafka:
  brokers:
    - localhost:9092
  group_id: happy-billing-consumer
  auto_commit: false
  max_retries: 3
  retry_backoff: 100  # 毫秒
  batch_size: 1000
  batch_timeout: 1000  # 毫秒

influxdb:
  url: http://localhost:8086
  token: your-influxdb-token
  org: happy-billing
  bucket: meter-data
  batch_size: 1000
  flush_interval: 5  # 秒

logger:
  level: info  # debug/info/warn/error
  format: json  # json/console
  output: stdout  # stdout/stderr/file
  file_path: logs/app.log
  max_size: 100  # MB
  max_backups: 5
  max_age: 30  # 天
  compress: true
