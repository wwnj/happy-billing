# Redis 配置文件

# 绑定地址
bind 0.0.0.0

# 端口
port 6379

# 数据持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 内存管理
maxmemory 512mb
maxmemory-policy allkeys-lru

# 日志
loglevel notice

# 快照
save 900 1
save 300 10
save 60 10000

# 安全（生产环境请设置密码）
# requirepass your_password_here

# 性能优化
tcp-backlog 511
timeout 0
tcp-keepalive 300
