auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# 提高速率限制，适合本地开发环境
limits_config:
  ingestion_rate_mb: 64          # 每个用户每秒64MB
  ingestion_burst_size_mb: 128   # 突发大小128MB
  max_streams_per_user: 10000    # 每个用户最多10000个流
  max_line_size: 256000          # 最大行大小256KB

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# 这是简化的Loki v3.x配置，专注于本地开发环境
