apiVersion: 1

datasources:
  # Loki 数据源
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        # 从日志中提取 trace_id，关联到 Jaeger
        - datasourceName: Jaeger
          matcherRegex: "trace_id=([\\w]+)"
          name: TraceID
          url: "$${__value.raw}"

  # Jaeger 数据源
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
    jsonData:
      tracesToLogs:
        # 从 trace 跳转到日志
        datasourceUid: 'loki'
        tags: ['trace_id']
        mappedTags: [{ key: 'trace_id', value: 'trace_id' }]
        mapTagNamesEnabled: true
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
